<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos – Phill Farrugia</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="alternate" type="application/atom+xml" title="Phill Farrugia" href="/blog/feed.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Baskervville';
            src: url('fonts/Baskervville-Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Baskervville';
            src: url('fonts/Baskervville-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }
        @view-transition {
            navigation: auto;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafaf8;
            --text: #3d3d3d;
            --text-mid: #6e6e6e;
            --text-light: #9a9a9a;
            --dot: #d0d0cd;
            --line: #e4e4e0;
            --nav-bg: rgba(250, 250, 248, 0.85);
            --shadow: rgba(0, 0, 0, 0.06);
            --footer: #bfbfba;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --text: #e0e0de;
                --text-mid: #a0a0a0;
                --text-light: #707070;
                --dot: #505050;
                --line: #2e2e2e;
                --nav-bg: rgba(26, 26, 26, 0.85);
                --shadow: rgba(0, 0, 0, 0.2);
                --footer: #484848;
            }
        }

        html { font-size: 16px; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 100;
            background: var(--bg);
            view-transition-name: header;
        }
        .nav-name {
            font-family: 'Baskervville', Baskerville, 'EB Garamond', Garamond, serif;
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text);
            text-decoration: none;
        }

        .nav-bio {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-light);
            margin-top: 4px;
            letter-spacing: -0.01em;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            margin-top: 20px;
        }

        .nav-links a {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: -0.01em;
            padding: 6px 14px;
            border-radius: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .nav-links a:hover {
            background: var(--line);
            color: var(--text);
        }

        .nav-links a.active {
            background: var(--line);
            color: var(--text);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 220px 48px 60px;
            view-transition-name: content;
        }

        ::view-transition-old(content) {
            animation: fade-out 0.2s ease forwards;
        }

        ::view-transition-new(content) {
            animation: fade-in 0.3s ease forwards;
        }

        ::view-transition-old(header),
        ::view-transition-new(header) {
            animation: none;
        }

        @keyframes fade-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-8px); }
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .photos-content {
            width: 100%;
            max-width: 720px;
        }

        .photos-content h2 {
            font-family: 'Baskervville', Baskerville, 'EB Garamond', Garamond, serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .photos-intro {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 32px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .photo-grid img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 8px;
            background: var(--line);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-grid img:hover {
            transform: scale(1.03);
        }

        .photo-placeholder {
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            background: var(--line);
            cursor: pointer;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(30, 30, 30, 0.95);
        }

        .lightbox-img {
            position: relative;
            object-fit: cover;
            clip-path: inset(0 round 8px);
            will-change: transform, clip-path;
        }

        .lightbox-meta {
            position: relative;
            margin-top: 16px;
            padding: 0 24px;
            text-align: center;
            font-size: 0.75rem;
            line-height: 1.6;
            letter-spacing: 0.01em;
            color: rgba(255, 255, 255, 0.45);
        }

        .lightbox-meta-camera {
            color: rgba(255, 255, 255, 0.8);
        }

        .lightbox-meta-exposure {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-variant-numeric: tabular-nums;
        }

        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .lightbox-close:hover {
            color: #fff;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            cursor: pointer;
            padding: 16px;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .lightbox-arrow:hover {
            color: #fff;
        }

        .lightbox-prev {
            left: 16px;
        }

        .lightbox-next {
            right: 16px;
        }

        footer {
            text-align: center;
            padding: 32px 48px;
            font-size: 0.65rem;
            font-weight: 300;
            color: var(--footer);
            letter-spacing: 0.02em;
        }

        @media (max-width: 600px) {
            nav {
                padding: 20px 24px;
                max-width: 100%;
            }

            main {
                padding: 180px 24px 24px;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            footer {
                padding: 8px 24px 24px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-name">Phill Farrugia</a>
        <span class="nav-bio">Senior Software Engineer in San Francisco, CA</span>
        <div class="nav-links">
            <a href="index.html">Work</a>
            <a href="about.html">About</a>
            <a href="blog/">Blog</a>
            <a href="photography.html" class="active">Photos</a>
        </div>
    </nav>

    <main>
        <div class="photos-content">
            <div class="photo-grid">
                <img src="images/photos/thumbs/IMG_5080.jpg" data-full="images/photos/IMG_5080.jpg" data-camera="iPhone 13 Pro" data-lens="Main Camera 26mm f/1.5" data-exposure="1/1377s" data-aperture="ƒ/1.5" data-iso="ISO 50" alt="Photo">
                <img src="images/photos/thumbs/IMG_9485.jpg" data-full="images/photos/IMG_9485.jpg" data-camera="iPhone 12 Pro Max" data-lens="Main Camera 26mm f/1.6" data-exposure="1/1109s" data-aperture="ƒ/1.6" data-iso="ISO 32" alt="Photo">
                <img src="images/photos/thumbs/Z72_1609.jpg" data-full="images/photos/Z72_1609.jpg" data-camera="Nikon Z7 II" data-lens="NIKKOR Z 24-200mm f/4-6.3 VR" data-exposure="1/10s" data-aperture="ƒ/14" data-iso="ISO 200" alt="Photo">
                <img src="images/photos/thumbs/Z72_1684.jpg" data-full="images/photos/Z72_1684.jpg" data-camera="Nikon Z7 II" data-lens="NIKKOR Z 24-200mm f/4-6.3 VR" data-exposure="1/25s" data-aperture="ƒ/8" data-iso="ISO 2000" alt="Photo">
                <img src="images/photos/thumbs/Z72_1869.jpg" data-full="images/photos/Z72_1869.jpg" data-camera="Nikon Z7 II" data-lens="NIKKOR Z 35mm f/1.8 S" data-exposure="1/2500s" data-aperture="ƒ/1.8" data-iso="ISO 100" alt="Photo">
                <img src="images/photos/thumbs/Z72_1747.jpg" data-full="images/photos/Z72_1747.jpg" data-camera="Nikon Z7 II" data-lens="NIKKOR Z 35mm f/1.8 S" data-exposure="1/2000s" data-aperture="ƒ/1.8" data-iso="ISO 250" alt="Photo">
                <img src="images/photos/thumbs/Z72_3194.jpg" data-full="images/photos/Z72_3194.jpg" data-camera="Nikon Z7 II" data-lens="NIKKOR Z 24-200mm f/4-6.3 VR" data-exposure="1/1250s" data-aperture="ƒ/6.3" data-iso="ISO 800" alt="Photo">
                <img src="images/photos/thumbs/Z72_6626.jpg" data-full="images/photos/Z72_6626.jpg" data-camera="Nikon Z7 II" data-lens="NIKKOR Z 24-200mm f/4-6.3 VR" data-exposure="1/100s" data-aperture="ƒ/6.3" data-iso="ISO 800" alt="Photo">
                <img src="images/photos/thumbs/Z72_7564-Enhanced-NR.jpg" data-full="images/photos/Z72_7564-Enhanced-NR.jpg" data-camera="Nikon Z7 II" data-lens="NIKKOR Z 24-200mm f/4-6.3 VR" data-exposure="1/400s" data-aperture="ƒ/8" data-iso="ISO 800" alt="Photo">
            </div>
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-backdrop"></div>
        <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
        <button class="lightbox-arrow lightbox-prev" onclick="navigateLightbox(-1)" aria-label="Previous">&lsaquo;</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="">
        <div class="lightbox-meta" id="lightboxMeta">
            <div><span class="lightbox-meta-camera" data-field="camera"></span> &nbsp;&middot;&nbsp; <span data-field="lens"></span></div>
            <div class="lightbox-meta-exposure">
                <span data-field="exposure"></span>
                <span data-field="aperture"></span>
                <span data-field="iso"></span>
            </div>
        </div>
        <button class="lightbox-arrow lightbox-next" onclick="navigateLightbox(1)" aria-label="Next">&rsaquo;</button>
    </div>

    <footer>
        &copy; <span id="year"></span> Phill Farrugia
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const backdrop = lightbox.querySelector('.lightbox-backdrop');
        const lightboxMeta = document.getElementById('lightboxMeta');
        // Buttons and EXIF text fade in and out with the backdrop
        const controls = [...lightbox.querySelectorAll('button'), lightboxMeta];
        const photos = Array.from(document.querySelectorAll('.photo-grid img'));
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const easing = 'cubic-bezier(0.32, 0.72, 0, 1)';
        let currentIndex = 0;
        let animating = false;

        // Size the lightbox image to fit 85vw x 85vh (less room for the EXIF text) at the photo's aspect ratio.
        // Thumbnails keep the original aspect ratio, so this works before the full image loads.
        function sizeLightboxImg(thumb) {
            const aspect = thumb.naturalWidth / thumb.naturalHeight;
            const metaSpace = lightboxMeta.offsetHeight + parseFloat(getComputedStyle(lightboxMeta).marginTop);
            const maxW = window.innerWidth * 0.85;
            const maxH = window.innerHeight * 0.85 - metaSpace;
            const w = Math.min(maxW, maxH * aspect);
            lightboxImg.style.width = w + 'px';
            lightboxImg.style.height = (w / aspect) + 'px';
        }

        // Show the cached thumbnail straight away, then swap in the full image once decoded.
        function showPhoto(index) {
            photos[currentIndex].style.visibility = '';
            currentIndex = index;
            const thumb = photos[index];
            thumb.style.visibility = 'hidden';
            lightboxMeta.querySelectorAll('[data-field]').forEach(el => {
                el.textContent = thumb.dataset[el.dataset.field];
            });
            sizeLightboxImg(thumb);
            lightboxImg.src = thumb.src;

            const full = new Image();
            full.src = thumb.dataset.full;
            full.decode().then(() => {
                if (currentIndex === index && lightbox.classList.contains('open')) {
                    lightboxImg.src = full.src;
                }
            }).catch(() => {});
        }

        // Keyframe that makes the lightbox image sit exactly over the thumbnail:
        // scaled to cover the thumbnail's box, cropped to it, with matching corners.
        function thumbKeyframe(thumb) {
            const t = thumb.getBoundingClientRect();
            const f = lightboxImg.getBoundingClientRect();
            const scale = Math.max(t.width / f.width, t.height / f.height);
            const dx = (t.left + t.width / 2) - (f.left + f.width / 2);
            const dy = (t.top + t.height / 2) - (f.top + f.height / 2);
            const insetX = (f.width - t.width / scale) / 2;
            const insetY = (f.height - t.height / scale) / 2;
            return {
                transform: `translate(${dx}px, ${dy}px) scale(${scale})`,
                clipPath: `inset(${insetY}px ${insetX}px round ${8 / scale}px)`
            };
        }

        const openKeyframe = { transform: 'none', clipPath: 'inset(0px 0px round 8px)' };

        function isInViewport(el) {
            const r = el.getBoundingClientRect();
            return r.bottom > 0 && r.top < window.innerHeight && r.right > 0 && r.left < window.innerWidth;
        }

        function fade(el, from, to, duration) {
            return el.animate({ opacity: [from, to] }, { duration, easing: 'ease', fill: 'both' });
        }

        document.querySelector('.photo-grid').addEventListener('click', (e) => {
            const img = e.target.closest('img');
            if (!img || animating) return;
            lightbox.classList.add('open');
            showPhoto(photos.indexOf(img));

            animating = true;
            const duration = reduceMotion.matches ? 200 : 450;
            fade(backdrop, 0, 1, duration);
            controls.forEach(c => fade(c, 0, 1, duration));
            const imgAnim = reduceMotion.matches
                ? fade(lightboxImg, 0, 1, duration)
                : lightboxImg.animate([thumbKeyframe(img), openKeyframe], { duration, easing });
            imgAnim.finished.then(() => { animating = false; });
        });

        function closeLightbox() {
            if (animating || !lightbox.classList.contains('open')) return;
            animating = true;
            const thumb = photos[currentIndex];
            const flyBack = !reduceMotion.matches && isInViewport(thumb);
            const duration = reduceMotion.matches ? 200 : 380;

            fade(backdrop, 1, 0, duration);
            controls.forEach(c => fade(c, 1, 0, duration * 0.6));
            const imgAnim = flyBack
                ? lightboxImg.animate([openKeyframe, thumbKeyframe(thumb)], { duration, easing, fill: 'forwards' })
                : fade(lightboxImg, 1, 0, duration);

            imgAnim.finished.then(() => {
                thumb.style.visibility = '';
                lightbox.classList.remove('open');
                lightboxImg.getAnimations().forEach(a => a.cancel());
                lightboxImg.removeAttribute('src');
                animating = false;
            });
        }

        function navigateLightbox(dir) {
            if (animating) return;
            showPhoto((currentIndex + dir + photos.length) % photos.length);
        }

        window.addEventListener('resize', () => {
            if (lightbox.classList.contains('open')) sizeLightboxImg(photos[currentIndex]);
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        backdrop.addEventListener('click', closeLightbox);
    </script>
</body>
</html>
