<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos – Phill Farrugia</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Baskervville';
            src: url('fonts/Baskervville-Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Baskervville';
            src: url('fonts/Baskervville-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafaf8;
            --text: #3d3d3d;
            --text-mid: #6e6e6e;
            --text-light: #9a9a9a;
            --dot: #d0d0cd;
            --line: #e4e4e0;
            --nav-bg: rgba(250, 250, 248, 0.85);
            --shadow: rgba(0, 0, 0, 0.06);
            --footer: #bfbfba;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --text: #e0e0de;
                --text-mid: #a0a0a0;
                --text-light: #707070;
                --dot: #505050;
                --line: #2e2e2e;
                --nav-bg: rgba(26, 26, 26, 0.85);
                --shadow: rgba(0, 0, 0, 0.2);
                --footer: #484848;
            }
        }

        html { font-size: 16px; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 100;
            background: var(--bg);
        }
        .nav-name {
            font-family: 'Baskervville', Baskerville, 'EB Garamond', Garamond, serif;
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text);
            text-decoration: none;
        }

        .nav-bio {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-light);
            margin-top: 4px;
            letter-spacing: -0.01em;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            margin-top: 20px;
        }

        .nav-links a {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: -0.01em;
            padding: 6px 14px;
            border-radius: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .nav-links a:hover {
            background: var(--line);
            color: var(--text);
        }

        .nav-links a.active {
            background: var(--line);
            color: var(--text);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 220px 48px 60px;
        }

        .photos-content {
            width: 100%;
            max-width: 720px;
        }

        .photos-content h2 {
            font-family: 'Baskervville', Baskerville, 'EB Garamond', Garamond, serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .photos-intro {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 32px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .photo-grid img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 8px;
            background: var(--line);
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .photo-grid img:hover {
            opacity: 0.85;
        }

        .photo-placeholder {
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            background: var(--line);
            cursor: pointer;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(30, 30, 30, 0.95);
            align-items: center;
            justify-content: center;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .lightbox-close:hover {
            color: #fff;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            cursor: pointer;
            padding: 16px;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .lightbox-arrow:hover {
            color: #fff;
        }

        .lightbox-prev {
            left: 16px;
        }

        .lightbox-next {
            right: 16px;
        }

        .font-size-widget {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 101;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            user-select: none;
        }

        .font-size-trigger {
            background: none;
            border: 1px solid var(--line);
            cursor: pointer;
            color: var(--text-light);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-family: inherit;
            letter-spacing: 0.01em;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            line-height: 1;
        }

        .font-size-trigger:hover,
        .font-size-widget.open .font-size-trigger {
            background: var(--line);
            color: var(--text);
            border-color: transparent;
        }

        .font-size-popover {
            position: absolute;
            bottom: calc(100% + 8px);
            right: 0;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            align-items: center;
            gap: 2px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(4px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .font-size-widget.open .font-size-popover {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .font-size-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
            line-height: 1;
            font-family: inherit;
            white-space: nowrap;
        }

        .font-size-btn:hover {
            background: var(--line);
            color: var(--text);
        }

        .font-size-btn-small { font-size: 0.7rem; }
        .font-size-btn-reset { font-size: 0.72rem; }
        .font-size-btn-large { font-size: 1rem; }

        footer {
            text-align: center;
            padding: 32px 48px;
            font-size: 0.65rem;
            font-weight: 300;
            color: var(--footer);
            letter-spacing: 0.02em;
        }

        @media (max-width: 600px) {
            nav {
                padding: 20px 24px;
                max-width: 100%;
            }

            main {
                padding: 180px 24px 40px;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .font-size-widget {
                bottom: 20px;
                right: 20px;
            }

            footer {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="font-size-widget" id="fontWidget">
        <div class="font-size-popover">
            <button class="font-size-btn font-size-btn-small" onclick="adjustFontSize(-1)" aria-label="Decrease font size">A</button>
            <button class="font-size-btn font-size-btn-reset" onclick="resetFontSize()" aria-label="Reset font size">Reset</button>
            <button class="font-size-btn font-size-btn-large" onclick="adjustFontSize(1)" aria-label="Increase font size">A</button>
        </div>
        <button class="font-size-trigger" onclick="toggleFontWidget()" aria-label="Font size">Aa</button>
    </div>

    <nav>
        <a href="index.html" class="nav-name">Phill Farrugia</a>
        <span class="nav-bio">Senior Software Engineer in San Francisco, CA</span>
        <div class="nav-links">
            <a href="index.html">Work</a>
            <a href="about.html">About</a>
            <a href="photography.html" class="active">Photos</a>
        </div>
    </nav>

    <main>
        <div class="photos-content">
            <div class="photo-grid">
                <img src="images/photos/IMG_5080.jpg" alt="Photo">
                <img src="images/photos/IMG_9485.jpg" alt="Photo">
                <img src="images/photos/Z72_1609.jpg" alt="Photo">
                <img src="images/photos/Z72_1684.jpg" alt="Photo">
                <img src="images/photos/Z72_1869.jpg" alt="Photo">
                <img src="images/photos/Z72_1747.jpg" alt="Photo">
                <img src="images/photos/Z72_3194.jpg" alt="Photo">
                <img src="images/photos/Z72_6626.jpg" alt="Photo">
                <img src="images/photos/Z72_7564-Enhanced-NR.jpg" alt="Photo">
            </div>
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
        <button class="lightbox-arrow lightbox-prev" onclick="navigateLightbox(-1)" aria-label="Previous">&lsaquo;</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="">
        <button class="lightbox-arrow lightbox-next" onclick="navigateLightbox(1)" aria-label="Next">&rsaquo;</button>
    </div>

    <footer>
        &copy; <span id="year"></span> Phill Farrugia
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const root = document.documentElement;
        const widget = document.getElementById('fontWidget');
        const sizes = [14, 16, 18, 20];
        let sizeIndex = 1;

        function toggleFontWidget() { widget.classList.toggle('open'); }
        function adjustFontSize(dir) {
            sizeIndex = Math.max(0, Math.min(sizes.length - 1, sizeIndex + dir));
            root.style.fontSize = sizes[sizeIndex] + 'px';
        }
        function resetFontSize() { sizeIndex = 1; root.style.fontSize = '16px'; }
        document.addEventListener('click', (e) => {
            if (!widget.contains(e.target)) widget.classList.remove('open');
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        let currentIndex = 0;
        let photos = [];

        document.querySelector('.photo-grid').addEventListener('click', (e) => {
            const img = e.target.closest('img');
            if (!img) return;
            photos = Array.from(document.querySelectorAll('.photo-grid img'));
            currentIndex = photos.indexOf(img);
            lightboxImg.src = img.src;
            lightbox.classList.add('open');
        });

        function closeLightbox() {
            lightbox.classList.remove('open');
        }

        function navigateLightbox(dir) {
            currentIndex = (currentIndex + dir + photos.length) % photos.length;
            lightboxImg.src = photos[currentIndex].src;
        }

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
    </script>
</body>
</html>
